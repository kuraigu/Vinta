# https://taskfile.dev
# ============================================================================
# NOTE: scripts.bat is the Single Source of Truth for all build, dev, and lint
# commands so contributors do not have to install Task to work on Vinta.
#
# Do NOT put raw build or lint logic in this file. Always update scripts.bat
# first and have Taskfile tasks call `scripts.bat <command>`.
# ============================================================================
version: "3"

tasks:
  default:
    desc: List all available development and build tasks
    cmds:
      - task --list

  help:
    desc: Show help and list available tasks
    cmds:
      - task --list
    silent: true

  doctor:
    desc: Check development environment toolchains, SDKs, and dependencies
    cmds:
      - cmd.exe /c "scripts.bat doctor"
    silent: true

  setup:
    desc: Install dependencies, configure CMake build tree, and download Go modules
    cmds:
      - cmd.exe /c "scripts.bat setup {{.CLI_ARGS}}"

  kill:
    desc: Terminate any running Vinta application processes
    cmds:
      - cmd.exe /c "scripts.bat kill"
    silent: true

  build:native:
    desc: Build native C++/WinRT bridge DLL using CMake and MSVC
    sources:
      - "backend/services/native/**/*.{cpp,h}"
      - "backend/services/native/CMakeLists.txt"
    generates:
      - "backend/services/vintaservices.dll"
      - "build/bin/vintaservices.dll"
    cmds:
      - cmd.exe /c "scripts.bat build-native"

  dev:
    desc: Start live development server (Vite + Wails) with DevTest panel enabled
    cmds:
      - cmd.exe /c "scripts.bat dev"

  showcase:
    desc: Start live development server with in-app Showcase Studio enabled
    cmds:
      - cmd.exe /c "scripts.bat showcase"

  dev:frontend:
    desc: Start Vite dev server for Wails v3 dev mode
    cmds:
      - cmd.exe /c "scripts.bat dev frontend"

  dev:nobuild:
    desc: Start live development server without rebuilding native C++ DLL
    cmds:
      - cmd.exe /c "scripts.bat dev no_build"

  dev:profile:
    desc: Start live development server with WebView2 remote debugging enabled (port 9222)
    cmds:
      - cmd.exe /c "scripts.bat dev profile"

  icon:
    desc: Generate multi-resolution build/windows/icon.ico from build/appicon.png
    sources:
      - "build/appicon.png"
    generates:
      - "build/windows/icon.ico"
    cmds:
      - cmd.exe /c "scripts.bat icon"

  generate:bindings:
    desc: Generate TypeScript bindings for frontend from Go backend
    sources:
      - "main.go"
      - "backend/**/*.go"
    generates:
      - "frontend/bindings/Vinta/backend/app.ts"
      - "frontend/bindings/**/*"
    cmds:
      - cmd.exe /c "scripts.bat bindings"

  build:frontend:
    desc: Build frontend production bundle using Vite
    cmds:
      - cmd.exe /c "scripts.bat build-frontend"

  generate:syso:
    desc: Generate Windows syso resource file
    sources:
      - "build/windows/icon.ico"
      - "build/windows/info.json"
      - "build/windows/wails.exe.manifest"
    generates:
      - "wails_windows_amd64.syso"
    cmds:
      - cmd.exe /c "scripts.bat syso"

  build:
    desc: Build application binary (production by default, dev with DEV=true)
    cmds:
      - '{{if eq .DEV "true"}}cmd.exe /c "scripts.bat build dev"{{else}}cmd.exe /c "scripts.bat build"{{end}}'

  package:installer:
    desc: Build standalone production binary and Windows NSIS installer
    cmds:
      - cmd.exe /c "scripts.bat installer"

  theme:pack:
    desc: Validate and package a theme directory into a distributable .vintatheme bundle
    cmds:
      - cmd.exe /c "scripts.bat pack-theme {{.CLI_ARGS}}"

  run:
    desc: Compile and run standalone binary
    cmds:
      - cmd.exe /c "scripts.bat run"

  run:debug:
    desc: Compile and run standalone binary with debug flags
    cmds:
      - cmd.exe /c "scripts.bat run debug"

  run:nobuild:
    desc: Launch pre-built binary directly without rebuilding
    cmds:
      - cmd.exe /c "scripts.bat run no_build"

  run:nobuild:debug:
    desc: Launch pre-built binary directly with debug flags
    cmds:
      - cmd.exe /c "scripts.bat run no_build debug"

  test:
    desc: Build and launch test suite binary with DevTest panel
    cmds:
      - cmd.exe /c "scripts.bat test"

  lint:native:
    desc: Run clang-format on native C++ services
    cmds:
      - cmd.exe /c "scripts.bat lint native"

  lint:
    desc: Run Go, C++, Frontend (TypeScript/ESLint/Prettier/AppIcons), Theme, and Locale checks
    cmds:
      - cmd.exe /c "scripts.bat lint"

  lint:ci:
    desc: Run all project linters in non-mutating CI check mode
    cmds:
      - cmd.exe /c "scripts.bat lint ci"

  check-themes:
    desc: Audit theme presets and validate --vinta-* CSS token references
    aliases: [themes:check]
    cmds:
      - cmd.exe /c "scripts.bat check-themes"

  check-locales:
    desc: Check translation key parity and schema across all locale catalogs
    aliases: [check-locals, locales:check]
    cmds:
      - cmd.exe /c "scripts.bat check-locales"

  check-transitions:
    desc: Audit frontend CSS transitions and reduced-motion coverage
    aliases: [transitions:check, check-motion]
    cmds:
      - cmd.exe /c "scripts.bat check-transitions {{.CLI_ARGS}}"

  check-settings:
    desc: Validate persistent setting keys, defaults, and localStorage usage
    aliases: [settings:check]
    cmds:
      - cmd.exe /c "scripts.bat check-settings {{.CLI_ARGS}}"

  check-settings:defaults:
    desc: Print all persistent setting keys and their default values
    aliases: [check-settings:default]
    cmds:
      - cmd.exe /c "scripts.bat check-settings defaults"

  check-hardcoded-ui:
    desc: Audit components and pages for hardcoded colors, strings, and native controls
    aliases: [hardcoded-ui:check]
    cmds:
      - cmd.exe /c "scripts.bat check-hardcoded-ui {{.CLI_ARGS}}"

  resource-profile:
    desc: Monitor live unscaled CPU% and RAM across Vinta's process tree
    cmds:
      - cmd.exe /c "scripts.bat resource-profile {{.CLI_ARGS}}"

  sync-locales:
    desc: Propagate new English keys from en.json to all other locale catalogs
    aliases: [sync-locals, locales:sync]
    cmds:
      - cmd.exe /c "scripts.bat sync-locales {{.CLI_ARGS}}"

  contributor:
    desc: "Add a contributor with a custom name (usage: task contributor -- <username> <roles> <name>)"
    cmds:
      - cmd.exe /c "scripts.bat contributor {{.CLI_ARGS}}"
