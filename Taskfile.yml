# https://taskfile.dev
# ============================================================================
# NOTE: scripts.bat is the Single Source of Truth for all build, dev, and lint
# commands so contributors do not have to install Task to work on Vinta.
#
# Do NOT put raw build or lint logic in this file. Always update scripts.bat
# first and have Taskfile tasks call `scripts.bat <command>`.
# ============================================================================
version: "3"

tasks:
  default:
    desc: Show available tasks and help tips
    cmds:
      - task: help
    silent: true

  help:
    desc: Show available tasks and help tips (pass `-- <command>` for command help)
    aliases: [list, ls]
    cmds:
      - '{{if .CLI_ARGS}}cmd.exe /c "scripts.bat help {{.CLI_ARGS}}"{{else}}task --list && echo "" && echo "Help tips:" && echo "  task --help                Show global Taskfile CLI help" && echo "  .\\scripts.bat --help       Show global scripts.bat usage and commands" && echo "  task <task> -- --help      Show command flags via scripts.bat (e.g. task lint -- --help)" && echo "  task help -- <command>     Defer directly to scripts.bat help (e.g. task help -- lint)"{{end}}'
    silent: true

  doctor:
    desc: Check development environment toolchains, SDKs, and dependencies
    cmds:
      - cmd.exe /c "scripts.bat doctor {{.CLI_ARGS}}"
    silent: true

  setup:
    desc: Install dependencies, configure CMake build tree, and download Go modules
    cmds:
      - cmd.exe /c "scripts.bat setup {{.CLI_ARGS}}"

  kill:
    desc: Terminate any running Vinta application processes
    cmds:
      - cmd.exe /c "scripts.bat kill"
    silent: true

  dev:
    desc: Start live development server (supports --no-build, --profile, --frontend)
    cmds:
      - cmd.exe /c "scripts.bat dev {{.CLI_ARGS}}"

  showcase:
    desc: Start live development server with in-app Showcase Studio enabled
    cmds:
      - cmd.exe /c "scripts.bat showcase"

  build:
    desc: Build application binary (supports --dev)
    cmds:
      - '{{if eq .DEV "true"}}cmd.exe /c "scripts.bat build --dev"{{else}}cmd.exe /c "scripts.bat build {{.CLI_ARGS}}"{{end}}'

  build:native:
    desc: Build native C++/WinRT bridge DLL using CMake and MSVC
    sources:
      - "backend/services/native/**/*.{cpp,h}"
      - "backend/services/native/CMakeLists.txt"
    generates:
      - "backend/services/vintaservices.dll"
      - "build/bin/vintaservices.dll"
    cmds:
      - cmd.exe /c "scripts.bat build-native"

  build:frontend:
    desc: Build frontend production bundle using Vite
    cmds:
      - cmd.exe /c "scripts.bat build-frontend"

  run:
    desc: Compile and run standalone binary (supports --no-build, --debug)
    cmds:
      - cmd.exe /c "scripts.bat run {{.CLI_ARGS}}"

  test:
    desc: Build and launch test suite binary with DevTest panel (supports --no-build)
    cmds:
      - cmd.exe /c "scripts.bat test {{.CLI_ARGS}}"

  lint:
    desc: Run Go, C++, Frontend, Theme, and Locale linters (supports --ci, --native, --all, --strict)
    cmds:
      - cmd.exe /c "scripts.bat lint {{.CLI_ARGS}}"

  icon:
    desc: Generate multi-resolution build/windows/icon.ico from build/appicon.png
    sources:
      - "build/appicon.png"
    generates:
      - "build/windows/icon.ico"
    cmds:
      - cmd.exe /c "scripts.bat icon"

  generate:bindings:
    desc: Generate TypeScript bindings for frontend from Go backend
    sources:
      - "main.go"
      - "backend/**/*.go"
    generates:
      - "frontend/bindings/Vinta/backend/app.ts"
      - "frontend/bindings/**/*"
    cmds:
      - cmd.exe /c "scripts.bat bindings"

  generate:syso:
    desc: Generate Windows syso resource file
    sources:
      - "build/windows/icon.ico"
      - "build/windows/info.json"
      - "build/windows/wails.exe.manifest"
    generates:
      - "wails_windows_amd64.syso"
    cmds:
      - cmd.exe /c "scripts.bat syso"

  package:installer:
    desc: Build standalone production binary and Windows NSIS installer
    cmds:
      - cmd.exe /c "scripts.bat installer"

  theme:pack:
    desc: Validate and package a theme directory into a .vintatheme bundle
    cmds:
      - cmd.exe /c "scripts.bat pack-theme {{.CLI_ARGS}}"

  check:themes:
    desc: Audit theme presets and validate --vinta-* CSS token references
    aliases: [check-themes]
    cmds:
      - cmd.exe /c "scripts.bat check-themes {{.CLI_ARGS}}"

  check:locales:
    desc: Check translation key parity, registration, and schema across all locale catalogs (supports --all)
    aliases: [check-locales, check-locals]
    cmds:
      - cmd.exe /c "scripts.bat check-locales {{.CLI_ARGS}}"

  check:transitions:
    desc: Audit frontend CSS transitions and reduced-motion coverage (supports --all, --strict)
    aliases: [check-transitions, check-motion]
    cmds:
      - cmd.exe /c "scripts.bat check-transitions {{.CLI_ARGS}}"

  check:settings:
    desc: Validate persistent setting keys, defaults, and localStorage usage (supports --defaults)
    aliases: [check-settings]
    cmds:
      - cmd.exe /c "scripts.bat check-settings {{.CLI_ARGS}}"

  check:hardcoded-ui:
    desc: Audit components and pages for hardcoded colors, strings, and native controls (supports --all, --changed, --strict)
    aliases: [check-hardcoded-ui]
    cmds:
      - cmd.exe /c "scripts.bat check-hardcoded-ui {{.CLI_ARGS}}"

  profile:resources:
    desc: Monitor live unscaled CPU% and RAM across Vinta's process tree
    aliases: [resource-profile]
    cmds:
      - cmd.exe /c "scripts.bat resource-profile {{.CLI_ARGS}}"

  sync:locales:
    desc: Propagate new English keys from en.json to all other locale catalogs (supports --prune, --dry-run)
    aliases: [sync-locales, sync-locals]
    cmds:
      - cmd.exe /c "scripts.bat sync-locales {{.CLI_ARGS}}"

  contributor:
    desc: "Add a contributor with a custom name (usage: task contributor -- <username> <roles> <name>)"
    cmds:
      - cmd.exe /c "scripts.bat contributor {{.CLI_ARGS}}"
