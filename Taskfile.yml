# https://taskfile.dev
version: '3'

vars:
  APP_NAME: Vinta
  BUILD_DIR: 'build/bin'

tasks:
  default:
    desc: List all available development and build tasks
    cmds:
      - task --list

  help:
    desc: Show help and list available tasks
    cmds:
      - task --list
    silent: true

  doctor:
    desc: Check development environment toolchains, SDKs, and dependencies
    cmds:
      - powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./scripts/doctor.ps1
    silent: true

  setup:
    desc: Install dependencies, configure CMake build tree, and download Go modules
    cmds:
      - powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./scripts/setup.ps1
    silent: false

  kill:
    desc: Terminate any running Vinta application processes
    cmds:
      - cmd.exe /c "taskkill /IM Vinta.exe /F >nul 2>&1 || exit 0"
    silent: true

  build:native:
    desc: Build native C++/WinRT bridge DLL using CMake and MSVC
    deps: [kill]
    sources:
      - 'backend/services/native/**/*.{cpp,h}'
      - 'backend/services/native/CMakeLists.txt'
    generates:
      - 'backend/services/vintaservices.dll'
      - 'build/bin/vintaservices.dll'
    cmds:
      - powershell.exe -NoProfile -Command "if (-not (Test-Path build/native)) { cmake -B build/native -S backend/services/native -G 'Visual Studio 18 2026' -A x64 }; cmake --build build/native --config Release"

  dev:
    desc: Start live development server (Vite + Wails) with DevTest panel enabled
    deps: [build:native]
    cmds:
      - cmd.exe /c "taskkill /IM Vinta.exe /F >nul 2>&1 || exit 0"
      - wails3 dev -config ./build/config.yml -port 9245

  dev:frontend:
    desc: Start Vite dev server for Wails v3 dev mode
    deps: [generate:bindings]
    cmds:
      - cmd.exe /c "cd frontend && npm run dev -- --port 9245 --strictPort"

  dev:nobuild:
    desc: Start live development server without rebuilding native C++ DLL
    cmds:
      - cmd.exe /c "taskkill /IM Vinta.exe /F >nul 2>&1 || exit 0"
      - wails3 dev -config ./build/config.yml -port 9245

  icon:
    desc: Generate multi-resolution build/windows/icon.ico from build/appicon.png
    sources:
      - 'build/appicon.png'
    generates:
      - 'build/windows/icon.ico'
    cmds:
      - powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./scripts/generate_icon.ps1

  generate:bindings:
    desc: Generate TypeScript bindings for frontend from Go backend
    sources:
      - 'main.go'
      - 'backend/**/*.go'
    generates:
      - 'frontend/bindings/Vinta/backend/app.ts'
      - 'frontend/bindings/**/*'
    cmds:
      - wails3 generate bindings -ts

  build:frontend:
    desc: Build frontend production bundle using Vite
    deps: [generate:bindings]
    cmds:
      - cmd.exe /c "cd frontend && npm run build"

  generate:syso:
    desc: Generate Windows syso resource file
    sources:
      - 'build/windows/icon.ico'
      - 'build/windows/info.json'
      - 'build/windows/wails.exe.manifest'
    generates:
      - 'wails_windows_amd64.syso'
    cmds:
      - wails3 generate syso -arch amd64 -icon build/windows/icon.ico -manifest build/windows/wails.exe.manifest -info build/windows/info.json -out wails_windows_amd64.syso

  build:
    desc: Build application binary (production by default, dev with DEV=true)
    deps: [build:native, icon, build:frontend, generate:syso]
    cmds:
      - cmd.exe /c "taskkill /IM Vinta.exe /F >nul 2>&1 || exit 0"
      - powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./scripts/increment_build.ps1
      - '{{if eq .DEV "true"}}go build -tags devtest -o "{{.BUILD_DIR}}/{{.APP_NAME}}.exe" .{{else}}go build -trimpath -ldflags="-w -s -H windowsgui" -o "{{.BUILD_DIR}}/{{.APP_NAME}}.exe" .{{end}}'
      - powershell.exe -NoProfile -Command "if (Test-Path wails_windows_amd64.syso) { Remove-Item -Force wails_windows_amd64.syso }"

  package:installer:
    desc: Build standalone production binary and Windows NSIS installer
    deps: [build:native, icon]
    cmds:
      - cmd.exe /c "taskkill /IM Vinta.exe /F >nul 2>&1 || exit 0"
      - powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./scripts/increment_build.ps1
      - powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./scripts/package_installer.ps1

  theme:pack:
    desc: Validate and package a theme directory into a distributable .vintatheme bundle
    cmds:
      - powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./scripts/pack-theme.ps1 {{.CLI_ARGS}}

  run:
    desc: Compile and run standalone binary
    deps: [build]
    cmds:
      - cmd.exe /c "taskkill /IM Vinta.exe /F >nul 2>&1 || exit 0"
      - powershell.exe -NoProfile -Command "Start-Process 'build/bin/Vinta.exe'"

  run:debug:
    desc: Compile and run standalone binary with debug flags
    deps:
      - task: build
        vars:
          DEV: "true"
    cmds:
      - cmd.exe /c "taskkill /IM Vinta.exe /F >nul 2>&1 || exit 0"
      - powershell.exe -NoProfile -Command "Start-Process 'build/bin/Vinta.exe' -ArgumentList '-debug'"

  run:nobuild:
    desc: Launch pre-built binary directly without rebuilding
    cmds:
      - cmd.exe /c "taskkill /IM Vinta.exe /F >nul 2>&1 || exit 0"
      - powershell.exe -NoProfile -Command "Start-Process 'build/bin/Vinta.exe'"

  run:nobuild:debug:
    desc: Launch pre-built binary directly with debug flags
    cmds:
      - cmd.exe /c "taskkill /IM Vinta.exe /F >nul 2>&1 || exit 0"
      - powershell.exe -NoProfile -Command "Start-Process 'build/bin/Vinta.exe' -ArgumentList '-debug'"

  test:
    desc: Build and launch test suite binary with DevTest panel
    deps:
      - task: build
        vars:
          DEV: "true"
    cmds:
      - cmd.exe /c "taskkill /IM Vinta.exe /F >nul 2>&1 || exit 0"
      - powershell.exe -NoProfile -Command "Start-Process 'build/bin/Vinta.exe'"

  lint:native:
    desc: Run clang-format on native C++ services
    cmds:
      - powershell.exe -NoProfile -Command "if (Get-Command clang-format -ErrorAction SilentlyContinue) { Get-ChildItem -Path 'backend/services/native/*.cpp','backend/services/native/*.h' | ForEach-Object { clang-format -i $_.FullName } } else { Write-Host 'clang-format not found on PATH, skipping native C++ formatting.' }"

  lint:
    desc: Run Go formatting, golangci-lint, native C++ formatting, and frontend TypeScript/ESLint/Prettier checks
    deps: [generate:bindings]
    cmds:
      - echo "Running Go Lint..."
      - gofmt -w .
      - golangci-lint run
      - echo "Running Native C++ Lint..."
      - task: lint:native
      - echo "Running Frontend Lint..."
      - cmd.exe /c "cd frontend && npm run check && npm run lint && npm run format"
