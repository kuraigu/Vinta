<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 84" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <style>
      @keyframes sunPulse {
        0%, 100% { opacity: 0.75; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.05); }
      }
      @keyframes ringWave {
        0%, 100% { transform: scale(1); opacity: 0.5; }
        50% { transform: scale(1.03); opacity: 0.85; }
      }
      @keyframes moteFloat {
        0% { transform: translateY(4px) translateX(0px); opacity: 0; }
        35% { opacity: 0.8; }
        75% { opacity: 0.55; }
        100% { transform: translateY(-12px) translateX(-3px); opacity: 0; }
      }

      .sun-glow { transform-origin: 273px 39px; animation: sunPulse 6s ease-in-out infinite; }
      .ring-a { transform-origin: 314px 86px; animation: ringWave 7s ease-in-out infinite; }
      .ring-b { transform-origin: 314px 86px; animation: ringWave 7s ease-in-out 1.8s infinite; }
      .m1 { animation: moteFloat 5.5s ease-in-out infinite; }
      .m2 { animation: moteFloat 7s ease-in-out 1.6s infinite; }
    </style>

    <!-- Filters -->
    <filter id="softBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" />
    </filter>
    <filter id="deepAtmo" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" />
    </filter>
    <filter id="archGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- NEW: feathered edge mask so artwork fades out before touching corners/edges -->
    <filter id="edgeBlur" filterUnits="userSpaceOnUse" x="-20" y="-20" width="360" height="124">
      <feGaussianBlur stdDeviation="5" />
    </filter>
    <mask id="edgeFade" maskUnits="userSpaceOnUse" x="0" y="0" width="320" height="84">
      <rect width="320" height="84" fill="#000" />
      <rect x="6" y="6" width="308" height="72" fill="#fff" filter="url(#edgeBlur)" />
    </mask>

    <!-- Main Card Base -->
    <linearGradient id="cardBase" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14171c" />
      <stop offset="48%" stop-color="#16191f" />
      <stop offset="78%" stop-color="#231618" />
      <stop offset="100%" stop-color="#2c1d16" />
    </linearGradient>

    <!-- Deep Crimson/Wine Atmospheric Pool -->
    <radialGradient id="crimsonPool" cx="68%" cy="88%" r="42%">
      <stop offset="0%" stop-color="#7a1822" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#16191f" stop-opacity="0" />
    </radialGradient>

    <!-- Warm Golden Sunset Bounce on the Cellar Floor -->
    <linearGradient id="floorBounce" x1="88%" y1="45%" x2="48%" y2="96%">
      <stop offset="0%" stop-color="#c78d42" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#14171c" stop-opacity="0" />
    </linearGradient>

    <!-- Sunset Portal Sky -->
    <linearGradient id="portalSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d49b57" />
      <stop offset="100%" stop-color="#b86e33" />
    </linearGradient>

    <!-- Portal Sun Bloom -->
    <radialGradient id="portalBloom" cx="60%" cy="55%" r="55%">
      <stop offset="0%" stop-color="#ffe699" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#b86e33" stop-opacity="0" />
    </radialGradient>

    <!-- Cellar Archway Pillar Shading -->
    <linearGradient id="archStroke1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7a582b" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#4a1c20" stop-opacity="0.3" />
    </linearGradient>

    <!-- Outer Rose-Gold Sweeping Arcs -->
    <linearGradient id="roseGoldArc" x1="0%" y1="90%" x2="90%" y2="10%">
      <stop offset="0%" stop-color="#8a2434" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#c7993e" stop-opacity="0.4" />
    </linearGradient>

    <!-- Tight Bottom-Right Gold Rings -->
    <linearGradient id="tightGoldArc" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9e7025" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#c7993e" stop-opacity="0.6" />
    </linearGradient>

    <!-- Text Contrast Scrim -->
    <linearGradient id="textScrim" x1="0%" y1="0%" x2="65%" y2="0%">
      <stop offset="0%" stop-color="#14171c" stop-opacity="0.65" />
      <stop offset="60%" stop-color="#14171c" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#14171c" stop-opacity="0" />
    </linearGradient>

    <!-- Portal Archway Clip -->
    <clipPath id="portalClip">
      <path d="M 248 61 L 248 41 A 23 22 0 0 1 294 41 L 294 61 Q 271 57 248 61 Z" />
    </clipPath>
  </defs>

  <!-- 1. Deep Dark Card Base (full-bleed, stays untouched) -->
  <rect x="-1" y="-1" width="322" height="86" fill="url(#cardBase)" />

  <!-- 2. Artwork, now masked so nothing hits the corners/edges -->
  <g mask="url(#edgeFade)">
    <ellipse cx="225" cy="74" rx="68" ry="28" fill="url(#crimsonPool)" filter="url(#deepAtmo)" />
    <circle cx="272" cy="44" r="38" fill="#b86e33" fill-opacity="0.2" filter="url(#deepAtmo)" />

    <!-- Recessed 3D Cellar Vault Corridors -->
    <path d="M 198 76 L 198 42 A 50 44 0 0 1 298 42 L 298 76" fill="#170e10" fill-opacity="0.5" stroke="url(#archStroke1)" stroke-width="2" />
    <path d="M 224 72 L 224 40 A 36 33 0 0 1 296 40 L 296 72" fill="#1f1214" fill-opacity="0.6" stroke="url(#archStroke1)" stroke-width="2" />

    <!-- Sunlit Vineyard Portal (Animated) -->
    <g clip-path="url(#portalClip)">
      <rect x="245" y="16" width="52" height="48" fill="url(#portalSky)" />
      <circle class="sun-glow" cx="273" cy="39" r="24" fill="url(#portalBloom)" />

      <path d="M 245 43 Q 260 46 274 42 T 296 38 L 296 62 L 245 62 Z" fill="#b86e33" opacity="0.8" />
      <path d="M 245 47 Q 268 43 296 48 L 296 62 L 245 62 Z" fill="#8a6730" opacity="0.85" />
      <path d="M 245 50 Q 270 46 296 52 L 296 62 L 245 62 Z" fill="#544920" />

      <g fill="none" stroke="#7a7232" stroke-width="1.2" stroke-linecap="round" opacity="0.8">
        <path d="M 246 59 Q 256 53 266 48" />
        <path d="M 251 60 Q 261 53 271 48" />
        <path d="M 257 60 Q 267 54 276 49" />
        <path d="M 264 60 Q 273 54 281 49" />
        <path d="M 271 60 Q 279 55 286 50" />
        <path d="M 279 60 Q 286 55 292 51" />
      </g>

      <path d="M 283.5 50 L 284.8 40.5 L 286.1 50 Z" fill="#383116" opacity="0.9" />
      <path d="M 287.5 51 L 288.6 43 L 289.7 51 Z" fill="#383116" opacity="0.9" />
    </g>

    <!-- Inner Archway Rim -->
    <path d="M 248 61 L 248 41 A 23 22 0 0 1 294 41 L 294 61" fill="none" stroke="#d4ab55" stroke-opacity="0.65" stroke-width="1.3" filter="url(#archGlow)" />

    <!-- Cellar Floor & Light Spill -->
    <path d="M 182 84 Q 212 64 248 59 Q 271 56 294 58 L 306 84 Z" fill="url(#floorBounce)" />

    <!-- Outer Sweeping Rose-Gold Arcs -->
    <g fill="none" stroke="url(#roseGoldArc)" stroke-linecap="round" filter="url(#archGlow)">
      <circle cx="268" cy="58" r="64" stroke-width="1.2" />
      <circle cx="268" cy="58" r="51" stroke-width="1.4" />
    </g>

    <!-- Tight Bottom-Right Concentric Gold Rings (Animated) -->
    <g fill="none" stroke="url(#tightGoldArc)" stroke-linecap="round">
      <circle class="ring-a" cx="314" cy="86" r="68" stroke-width="1.1" stroke-opacity="0.5" />
      <circle class="ring-b" cx="314" cy="86" r="58" stroke-width="1.2" stroke-opacity="0.6" />
      <circle cx="314" cy="86" r="48" stroke-width="1.3" stroke-opacity="0.7" />
      <circle cx="314" cy="86" r="38" stroke-width="1.5" stroke-opacity="0.8" />
      <circle cx="314" cy="86" r="28" stroke-width="1.7" />
      <circle cx="314" cy="86" r="18" stroke-width="2" />
    </g>

    <!-- Floating Dust Motes (Animated) -->
    <g fill="#fae094">
      <circle class="m1" cx="242" cy="24" r="1" />
      <circle class="m2" cx="268" cy="15" r="1.1" />
      <circle class="m1" cx="286" cy="19" r="0.8" />
      <circle class="m2" cx="220" cy="32" r="0.7" />
      <circle cx="195" cy="25" r="0.8" opacity="0.5" />
      <circle cx="256" cy="20" r="0.7" opacity="0.6" />
      <circle cx="275" cy="9" r="0.8" opacity="0.7" />
      <circle cx="303" cy="21" r="0.9" />
      <circle cx="309" cy="11" r="0.6" />
    </g>
  </g>

  <!-- 3. Text Contrast Scrim -->
  <rect x="-1" y="-1" width="322" height="86" fill="url(#textScrim)" />
</svg>