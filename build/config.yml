# Vinta Wails v3 configuration
version: '3'

info:
  companyName: "FreeMatrix Studios"
  productName: "Vinta"
  productIdentifier: "com.freematrixstudios.vinta"
  description: "Adaptive Island for Windows PC"
  copyright: "Copyright © 2026 FreeMatrix Studios"
  comments: "Adaptive Island for Windows PC"
  version: "0.1.0"

dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - node_modules
      - frontend
      - bin
      - build
    file:
      - .DS_Store
      - .gitignore
      - .gitkeep
      - "*_test.go"
    watched_extension:
      - "*.go"
    git_ignore: true
  executes:
    - cmd: task build DEV=true
      type: blocking
    - cmd: task dev:frontend
      type: background
    - cmd: task run:nobuild
      type: primary
