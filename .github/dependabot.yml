version: 2
updates:
  # Maintain dependencies for npm
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    versioning-strategy: "increase-if-necessary"
    allow:
      - dependency-type: "all"
    groups:
      svelte-and-vite:
        patterns:
          - "svelte*"
          - "@sveltejs/*"
          - "vite*"
          - "typescript"
      eslint-and-prettier:
        patterns:
          - "*eslint*"
          - "@eslint/*"
          - "prettier*"
          - "svelte-check"
      types-and-utilities:
        patterns:
          - "@types/*"
          - "@tsconfig/*"
          - "tslib"
          - "globals"
          - "lucide-svelte"
        update-types:
          - "minor"
          - "patch"
    labels:
      - "deps"

  # Maintain dependencies for Go
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      backend-dependencies:
        patterns:
          - "*"
    labels:
      - "deps"

  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      github-actions-dependencies:
        patterns:
          - "*"
    labels:
      - "deps"
