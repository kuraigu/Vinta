name: Dependabot Triage & Auto-Close

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  contents: read

jobs:
  check-peer-deps:
    name: Check Peer Dependency Conflicts
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR Branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"

      - name: Verify npm Peer Dependencies & Lockfile
        id: npm_check
        continue-on-error: true
        run: |
          cd frontend
          npm install --dry-run --ignore-scripts
          npm ci --dry-run --ignore-scripts

      - name: Close PR if Peer Dependencies Conflict
        if: steps.npm_check.outcome == 'failure'
        uses: actions/github-script@v9
        with:
          script: |
            const issue_number = context.issue.number;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number,
              body: '**Dependabot Triage Notice**: This automated pull request failed dependency or lockfile resolution (`npm ci --dry-run`) due to a peer dependency conflict. Auto-closing this PR to prevent CI pipeline failures.'
            });

            await github.rest.pulls.update({
              owner,
              repo,
              pull_number: issue_number,
              state: 'closed'
            });
