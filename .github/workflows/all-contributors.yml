name: All Contributors

on:
  push:
    branches:
      - main
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  contribute:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'issue_comment' && (github.event.comment.author_association == 'OWNER' || github.event.comment.author_association == 'MEMBER' || github.event.comment.author_association == 'COLLABORATOR'))
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Update Contributors List
        run: |
          npx all-contributors-cli generate

      - name: Get Last Commit Info
        id: last_commit
        run: |
          echo "MSG=$(git log -1 --format='%h - %s' | tr -d '"')" >> $GITHUB_OUTPUT

      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: update contributors hall of fame (synced: ${{ steps.last_commit.outputs.MSG }}) [skip ci]"
          file_pattern: "docs/CONTRIBUTORS.md .all-contributorsrc"
