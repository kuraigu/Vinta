name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-and-build:
    name: Lint & Build
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26'
        
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        
    - name: Install Wails
      run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

    - name: Go Lint
      uses: golangci/golangci-lint-action@v6
      with:
        version: latest
        
    - name: Install Frontend Dependencies
      run: |
        cd frontend
        npm install

    - name: Frontend Lint & Check
      run: |
        cd frontend
        npm run lint
        npm run check

    - name: Wails Build Verification
      run: wails build
