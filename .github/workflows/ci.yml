name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  lint-and-build:
    name: Lint & Build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
          cache-dependency-path: go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Cache Wails CLI
        id: cache-wails
        uses: actions/cache@v4
        with:
          path: ~/go/bin/wails.exe
          key: ${{ runner.os }}-wails-2.13.0

      - name: Install Wails
        if: steps.cache-wails.outputs.cache-hit != 'true'
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci --prefer-offline

      - name: Create Placeholder Dist (Satisfy //go:embed)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path frontend/dist -Force | Out-Null
          "placeholder" | Out-File -FilePath frontend/dist/index.html -Encoding ascii

      - name: Generate Wails Bindings
        run: wails generate module

      - name: Frontend Lint & Check
        run: |
          cd frontend
          npm run format:check
          npm run lint
          npm run check

      - name: Check AppIcon Conflicts
        run: |
          cd frontend
          npm run check:conflicts

      - name: Wails Build Verification
        run: wails build -s

      - name: Go Lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
