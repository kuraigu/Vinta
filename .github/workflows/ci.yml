name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  lint-and-build:
    name: Lint & Build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm install

      - name: Create Placeholder Dist (Satisfy //go:embed)
        run: |
          mkdir frontend/dist
          echo "placeholder" > frontend/dist/index.html

      - name: Generate Wails Bindings
        run: wails generate module

      - name: Frontend Lint & Check
        run: |
          cd frontend
          npm run lint
          npm run check

      - name: Wails Build Verification
        run: wails build

      - name: Go Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
