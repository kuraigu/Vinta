name: Release Vinta

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v0.1.0-alpha, v0.2.0 - Leave blank to auto-detect and increment)'
        required: false
        default: ''
      release_notes:
        description: 'Release highlights / changelog (Optional: leave blank to auto-generate from PRs/commits)'
        required: false
        type: string
        default: ''
      draft:
        description: 'Create as a Private Draft Release'
        required: true
        type: boolean
        default: true
      prerelease:
        description: 'Mark as a Pre-release'
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release Windows App
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve Release Version
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $inputVersion = "${{ github.event.inputs.version }}".Trim()
          if (-not $inputVersion -or $inputVersion -eq "auto") {
              $latestTag = (gh release list --limit 1 --json tagName --jq '.[0].tagName' 2>$null)
              if ($latestTag) {
                  Write-Host "Detected latest release tag: $latestTag"
                  if ($latestTag -match '^v?(\d+)\.(\d+)\.(\d+)(.*)$') {
                      $major = [int]$Matches[1]
                      $minor = [int]$Matches[2]
                      $patch = [int]$Matches[3] + 1
                      $extra = $Matches[4]
                      $version = "v$major.$minor.$patch$extra"
                  } else {
                      $version = "$latestTag.1"
                  }
              } else {
                  $version = "v0.1.0-alpha"
              }
              Write-Host "Auto-incremented release version: $version"
          } else {
              $version = $inputVersion
          }
          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
          cache-dependency-path: go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set up CMake and Ninja
        uses: ashutoshvarma/setup-ninja@master
        with:
          version: '1.11.1'

      - name: Install NSIS
        run: |
          choco install nsis -y --no-progress
          echo "C:\Program Files (x86)\NSIS" >> $env:GITHUB_PATH

      - name: Cache Wails CLI
        id: cache-wails
        uses: actions/cache@v4
        with:
          path: ~/go/bin/wails.exe
          key: ${{ runner.os }}-wails-2.13.0

      - name: Install Wails
        if: steps.cache-wails.outputs.cache-hit != 'true'
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci --prefer-offline

      - name: Build Native WinRT Bridge DLL (CMake)
        run: |
          cmake -B build/native -S backend/services/native -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/native --config Release

      - name: Generate Multi-Resolution Windows Icon
        shell: pwsh
        run: ./scripts/generate_icon.ps1

      - name: Build Official Application & NSIS Installer
        shell: pwsh
        run: |
          $version = "$env:RELEASE_VERSION"
          $buildDate = (Get-Date -Format 'yy.MMdd')
          $ldflags = "-X 'Vinta/backend.BuildType=Official' -X 'Vinta/backend.AppVersion=$version' -X 'Vinta/backend.GitCommit=${{ github.sha }}' -X 'Vinta/backend.BuildTime=$buildDate' -X 'backend.BuildType=Official' -X 'backend.AppVersion=$version' -X 'backend.GitCommit=${{ github.sha }}' -X 'backend.BuildTime=$buildDate'"
          wails build -nsis -s -ldflags $ldflags

      - name: Sign Executables and Installer
        shell: pwsh
        env:
          SIGNING_CERT_BASE64: ${{ secrets.SIGNING_CERT_BASE64 }}
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          $pfxPath = "$env:TEMP\signing_cert.pfx"
          $cert = $null

          if ($env:SIGNING_CERT_BASE64 -and $env:SIGNING_CERT_PASSWORD) {
              Write-Host "Using production Code Signing Certificate from secrets..."
              [System.IO.File]::WriteAllBytes($pfxPath, [System.Convert]::FromBase64String($env:SIGNING_CERT_BASE64))
              $cert = Get-PfxCertificate -FilePath $pfxPath
          } else {
              Write-Host "Creating FreeMatrix Studios Code Signing Certificate..."
              $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=FreeMatrix Studios, O=FreeMatrix Studios, C=US" -CertStoreLocation "Cert:\CurrentUser\My" -HashAlgorithm SHA256 -NotAfter (Get-Date).AddYears(5)
              Export-Certificate -Cert $cert -FilePath "build/FreeMatrixStudios.cer" | Out-Null
          }

          $targets = Get-Item "build/bin/Vinta.exe", "build/bin/Vinta-Setup-x64.exe" -ErrorAction SilentlyContinue
          foreach ($file in $targets) {
              Write-Host "Signing $($file.FullName)..."
              Set-AuthenticodeSignature -FilePath $file.FullName -Certificate $cert -HashAlgorithm SHA256 -TimestampServer "http://timestamp.digicert.com"
          }

      - name: Prepare Release Artifacts
        shell: pwsh
        run: |
          $version = "$env:RELEASE_VERSION"
          New-Item -ItemType Directory -Path "release-dist" -Force | Out-Null

          # 1. Copy NSIS Installer with version in filename
          $installerSrc = Get-Item "build/bin/Vinta-Setup-x64.exe", "build/bin/Vinta-*-installer.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($installerSrc) {
              Copy-Item $installerSrc.FullName "release-dist/Vinta-$version-Setup-x64.exe"
          }

          # 2. Package Portable ZIP bundle with version in filename
          $portableDir = "build/portable-bundle"
          New-Item -ItemType Directory -Path $portableDir -Force | Out-Null
          Copy-Item "build/bin/Vinta.exe" "$portableDir/"

          # Copy vintaservices.dll from native build output or backend/services
          $dllSrc = Get-Item "backend/services/vintaservices.dll", "build/bin/vintaservices.dll", "build/native/vintaservices.dll", "build/native/Release/vintaservices.dll" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($dllSrc) {
              Copy-Item $dllSrc.FullName "$portableDir/vintaservices.dll"
              Copy-Item $dllSrc.FullName "build/bin/vintaservices.dll" -Force -ErrorAction SilentlyContinue
          }

          if (Test-Path "LICENSE") { Copy-Item "LICENSE" "$portableDir/" }
          if (Test-Path "README.md") { Copy-Item "README.md" "$portableDir/" }

          if (Test-Path "build/FreeMatrixStudios.cer") {
              Copy-Item "build/FreeMatrixStudios.cer" "release-dist/"
          }

          Compress-Archive -Path "$portableDir/*" -DestinationPath "release-dist/Vinta-$version-Portable-x64.zip" -Force

          # 3. Generate SHA256 Checksums
          Set-Location release-dist
          Get-ChildItem -File | Where-Object { $_.Name -ne "SHA256SUMS.txt" } | ForEach-Object {
              $hash = (Get-FileHash $_.Name -Algorithm SHA256).Hash.ToLower()
              "$hash  $($_.Name)" | Out-File -FilePath "SHA256SUMS.txt" -Append -Encoding ascii
          }
          Get-Content "SHA256SUMS.txt"

      - name: Generate Clean Release Changelog
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_NOTES_INPUT: ${{ github.event.inputs.release_notes }}
          IS_PRERELEASE_INPUT: ${{ github.event.inputs.prerelease }}
        run: |
          $version = "$env:RELEASE_VERSION"
          $isPrerelease = $env:IS_PRERELEASE_INPUT -eq "true" -or $version -match "alpha|beta|rc"

          # Format version for shields.io badge (hyphens escaped as --)
          $badgeVersion = $version.Replace("-", "--")
          $status = if ($version -match "alpha") { "alpha" } elseif ($version -match "beta") { "beta" } elseif ($version -match "rc") { "rc" } elseif ($isPrerelease) { "prerelease" } else { "stable" }
          $statusColor = if ($status -eq "stable") { "green" } elseif ($status -eq "beta") { "yellow" } else { "orange" }

          $header = "![Version](https://img.shields.io/badge/version-$badgeVersion-blue)`n![Status](https://img.shields.io/badge/status-$status-$statusColor)"

          $customNotes = if ($env:RELEASE_NOTES_INPUT) { $env:RELEASE_NOTES_INPUT.Trim() } else { "" }

          if ($customNotes) {
              $body = "$header`n`n$customNotes"
          } else {
              # Find previous release tag
              $prevTag = (gh release list --limit 2 --json tagName --jq '.[1].tagName' 2>$null)
              if (-not $prevTag) {
                  $prevTag = (git describe --tags --abbrev=0 HEAD^ 2>$null)
              }

              $rawCommits = if ($prevTag) {
                  git log "$prevTag..HEAD" --no-merges --pretty=format:"%s"
              } else {
                  git log -n 100 --no-merges --pretty=format:"%s"
              }

              $commits = [System.Collections.Generic.List[string]]::new()
              $dependencies = [System.Collections.Generic.List[string]]::new()

              foreach ($line in ($rawCommits -split "`r?`n")) {
                  $msg = $line.Trim()
                  if (-not $msg) { continue }
                  # Skip git merge commits
                  if ($msg -match '^Merge (branch|pull request|remote-tracking)') { continue }

                  # Route dependabot and dependency bumps to bottom
                  if ($msg -match 'dependabot' -or $msg -match '^(build|chore)\(deps(-dev)?\):' -or $msg -match '^Bump ') {
                      $dependencies.Add("- $msg")
                  } else {
                      $commits.Add("- $msg")
                  }
              }

              $changelogSections = [System.Collections.Generic.List[string]]::new()
              $changelogSections.Add("## What's Changed")

              if ($commits.Count -gt 0) {
                  $changelogSections.Add(($commits -join "`n"))
              }

              if ($dependencies.Count -gt 0) {
                  $changelogSections.Add("### Dependencies`n" + ($dependencies -join "`n"))
              }

              if ($commits.Count -eq 0 -and $dependencies.Count -eq 0) {
                  $changelogSections.Add("- Minor updates, bug fixes, and stability improvements.")
              }

              $body = "$header`n`n" + ($changelogSections -join "`n`n")
          }

          [System.IO.File]::WriteAllText("$env:GITHUB_WORKSPACE/RELEASE_CHANGELOG.md", $body)

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_VERSION }}
          name: Release ${{ env.RELEASE_VERSION }}
          draft: ${{ github.event.inputs.draft }}
          prerelease: ${{ github.event.inputs.prerelease }}
          body_path: RELEASE_CHANGELOG.md
          files: release-dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
