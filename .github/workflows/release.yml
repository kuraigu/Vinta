name: Release Vinta

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v0.1.0-alpha, v0.2.0 - Leave blank to auto-detect and increment)'
        required: false
        default: ''
      release_notes:
        description: 'Release highlights / changelog (Optional: leave blank to auto-generate from PRs/commits)'
        required: false
        type: string
        default: ''
      draft:
        description: 'Create as a Private Draft Release'
        required: true
        type: boolean
        default: true
      prerelease:
        description: 'Mark as a Pre-release'
        required: true
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-and-release:
    name: Build & Release Windows App
    runs-on: windows-latest
    if: github.repository == 'kuraigu/Vinta'
    env:
      RELEASE_VERSION: ''
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve Release Version
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $inputVersion = "${{ github.event.inputs.version }}".Trim()
          if (-not $inputVersion -or $inputVersion -eq "auto") {
              $latestTag = (gh release list --limit 1 --json tagName --jq '.[0].tagName' 2>$null)
              if ($latestTag) {
                  Write-Host "Detected latest release tag: $latestTag"
                  if ($latestTag -match '^v?(\d+)\.(\d+)\.(\d+)(.*)$') {
                      $major = [int]$Matches[1]
                      $minor = [int]$Matches[2]
                      $patch = [int]$Matches[3] + 1
                      $extra = $Matches[4]
                      $version = "v$major.$minor.$patch$extra"
                  } else {
                      $version = "$latestTag.1"
                  }
              } else {
                  $version = "v0.1.0-alpha"
              }
              Write-Host "Auto-incremented release version: $version"
          } else {
              $version = $inputVersion
          }
          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set up CMake and Ninja
        uses: ashutoshvarma/setup-ninja@master
        with:
          version: '1.11.1'

      - name: Install NSIS
        run: |
          choco install nsis -y --no-progress
          echo "C:\Program Files (x86)\NSIS" >> $env:GITHUB_PATH

      - name: Install Wails v3 CLI & Task
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@latest
          go install github.com/go-task/task/v3/cmd/task@latest

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm install

      - name: Build Native WinRT Bridge DLL (CMake)
        run: |
          cmake -B build/native -S backend/services/native -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/native --config Release

      - name: Generate Multi-Resolution Windows Icon
        shell: pwsh
        run: ./scripts/generate_icon.ps1

      - name: Build Official Application & NSIS Installer
        shell: pwsh
        env:
          UPDATER_TOKEN: ${{ secrets.UPDATER_TOKEN }}
        run: |
          $version = "$env:RELEASE_VERSION"
          $buildDate = (Get-Date -Format 'yy.MMdd')
          $updaterToken = if ($env:UPDATER_TOKEN) { $env:UPDATER_TOKEN.Trim() } else { "" }
          $ldflags = "-w -s -H windowsgui -X 'Vinta/backend.BuildType=Official' -X 'Vinta/backend.AppVersion=$version' -X 'Vinta/backend.GitCommit=${{ github.sha }}' -X 'Vinta/backend.BuildTime=$buildDate' -X 'Vinta/backend.UpdaterToken=$updaterToken' -X 'backend.BuildType=Official' -X 'backend.AppVersion=$version' -X 'backend.GitCommit=${{ github.sha }}' -X 'backend.BuildTime=$buildDate' -X 'backend.UpdaterToken=$updaterToken'"

          # 1. Build Frontend
          cmd.exe /c "cd frontend && npm run build"

          # 2. Generate syso resource
          wails3 generate syso -arch amd64 -icon build/windows/icon.ico -manifest build/windows/wails.exe.manifest -info build/windows/info.json -out wails_windows_amd64.syso

          # 3. Build production binary
          New-Item -ItemType Directory -Path "build/bin" -Force | Out-Null
          go build -trimpath -ldflags="$ldflags" -o "build/bin/Vinta.exe" .

          if (Test-Path wails_windows_amd64.syso) {
              Remove-Item -Force wails_windows_amd64.syso
          }

          # 4. Compile NSIS Installer
          ./scripts/package_installer.ps1 -Version $version

      - name: Sign Executables and Installer
        shell: pwsh
        env:
          SIGNING_CERT_BASE64: ${{ secrets.SIGNING_CERT_BASE64 }}
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          $pfxPath = "$env:TEMP\signing_cert.pfx"
          $rawCert = if ($env:SIGNING_CERT_BASE64) { $env:SIGNING_CERT_BASE64.Trim() } else { "" }
          $rawPass = if ($env:SIGNING_CERT_PASSWORD) { $env:SIGNING_CERT_PASSWORD.Trim() } else { "" }

          if ($rawCert -and $rawPass) {
              try {
                  $certBytes = [System.Convert]::FromBase64String($rawCert)
                  if ($certBytes.Length -gt 0) {
                      [System.IO.File]::WriteAllBytes($pfxPath, $certBytes)
                      $secPassword = ConvertTo-SecureString -String $rawPass -AsPlainText -Force
                      $cert = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation "Cert:\CurrentUser\My" -Password $secPassword -ErrorAction Stop
                      Write-Host "Successfully loaded production Code Signing Certificate."

                      $targets = Get-Item "build/bin/Vinta.exe", "build/bin/Vinta-Setup-x64.exe" -ErrorAction SilentlyContinue
                      foreach ($file in $targets) {
                          Write-Host "Signing $($file.FullName)..."
                          Set-AuthenticodeSignature -FilePath $file.FullName -Certificate $cert -HashAlgorithm SHA256 -TimestampServer "http://timestamp.digicert.com"
                      }
                  }
              } catch {
                  Write-Warning "Failed to load production certificate from secrets: $($_.Exception.Message)"
              } finally {
                  if (Test-Path $pfxPath) {
                      Remove-Item $pfxPath -Force -ErrorAction SilentlyContinue
                  }
              }
          } else {
              Write-Host "No production code signing certificate secret provided. Skipping Authenticode signing."
          }

      - name: Prepare Release Artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "release-dist" -Force | Out-Null

          # 1. Copy NSIS Installer with stable filename for reputation and direct download links
          $installerSrc = Get-Item "build/bin/Vinta-Setup-x64.exe", "build/bin/Vinta-*-installer.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($installerSrc) {
              Copy-Item $installerSrc.FullName "release-dist/Vinta-Setup-x64.exe"
          }

          # 2. Generate SHA256 Checksums
          Set-Location release-dist
          Get-ChildItem -File | Where-Object { $_.Name -ne "SHA256SUMS.txt" } | ForEach-Object {
              $hash = (Get-FileHash $_.Name -Algorithm SHA256).Hash.ToLower()
              "$hash  $($_.Name)" | Out-File -FilePath "SHA256SUMS.txt" -Append -Encoding ascii
          }
          Get-Content "SHA256SUMS.txt"

      - name: Generate Formatted Release Notes
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $customNotes = "${{ github.event.inputs.release_notes }}".Trim()
          $version = "$env:RELEASE_VERSION"

          # Version badge encoding (escape dashes as -- for shields.io)
          $badgeVersion = $version -replace '-', '--'
          $versionBadge = "![Version](https://img.shields.io/badge/version-$badgeVersion-blue)"

          # Status badge detection
          if ($version -match 'alpha') {
              $statusBadge = "![Status](https://img.shields.io/badge/status-alpha-orange)"
          } elseif ($version -match 'beta') {
              $statusBadge = "![Status](https://img.shields.io/badge/status-beta-yellow)"
          } else {
              $statusBadge = "![Status](https://img.shields.io/badge/status-stable-brightgreen)"
          }

          if ($customNotes) {
              $finalBody = "$versionBadge $statusBadge`n`n$customNotes"
              Set-Content -Path "release-notes.md" -Value $finalBody -Encoding utf8
              exit 0
          }

          $prevTag = git describe --tags --abbrev=0 HEAD~1 2>$null
          if (-not $prevTag) {
              $prevTag = git tag --sort=-v:refname | Select-Object -First 1
          }

          <#
            Formats a changelog entry to shorten pull request links.
            Converts full pull request URLs into PR references and normalizes issue numbers.
          #>
          function Format-ChangelogEntry([string]$text) {
              if (-not $text) { return $text }
              $text = [regex]::Replace($text, '\bin\s+(https?://github\.com/[^/\s]+/[^/\s]+/pull/(\d+))/?', 'in PR: ([#$2]($1))')
              $text = [regex]::Replace($text, '(?<!\[)\(#(\d+)\)', '([#$1](https://github.com/${{ github.repository }}/pull/$1))')
              return $text
          }

          # Attempt auto-generation using GitHub Releases API
          $notesJson = $null
          try {
              $apiArgs = @(
                  "api",
                  "repos/${{ github.repository }}/releases/generate-notes",
                  "-f", "tag_name=$version",
                  "-f", "target_commitish=${{ github.sha }}"
              )
              if ($prevTag) {
                  $apiArgs += @("-f", "previous_tag_name=$prevTag")
              }
              $notesJson = gh @apiArgs 2>$null | ConvertFrom-Json
          } catch {
              $notesJson = $null
          }

          $rawBody = if ($notesJson -and $notesJson.body) { $notesJson.body } else { "" }
          $lines = if ($rawBody) { $rawBody -split "`r?`n" } else { @() }

          $featureLines = [System.Collections.Generic.List[string]]::new()
          $depLines = [System.Collections.Generic.List[string]]::new()
          $changelogLine = ""

          foreach ($line in $lines) {
              $trimmed = $line.Trim()
              if ($trimmed -like "*Full Changelog*:*") {
                  $changelogLine = $trimmed
                  continue
              }
              if ($trimmed -eq "## What's Changed" -or $trimmed -eq "") {
                  continue
              }

              $formattedLine = Format-ChangelogEntry $line
              if ($trimmed -match '(?i)build\(deps' -or $trimmed -match '(?i)\bbump\s+' -or $trimmed -match '(?i)dependabot') {
                  $depLines.Add($formattedLine)
              } else {
                  $featureLines.Add($formattedLine)
              }
          }

          # Fallback to git log when GitHub API returns no commit entries
          if ($featureLines.Count -eq 0 -and $depLines.Count -eq 0) {
              $range = if ($prevTag) { "$prevTag..HEAD" } else { "HEAD" }
              $gitCommits = git log $range --pretty=format:"%s" --reverse

              if ($gitCommits) {
                  foreach ($c in ($gitCommits -split "`r?`n")) {
                      $cTrimmed = $c.Trim()
                      if (-not $cTrimmed) { continue }
                      $entry = Format-ChangelogEntry "* $cTrimmed"
                      if ($cTrimmed -match '(?i)build\(deps' -or $cTrimmed -match '(?i)\bbump\s+' -or $cTrimmed -match '(?i)dependabot') {
                          $depLines.Add($entry)
                      } else {
                          $featureLines.Add($entry)
                      }
                  }
              }

              if (-not $changelogLine -and $prevTag) {
                  $changelogLine = "**Full Changelog**: https://github.com/${{ github.repository }}/compare/$prevTag...$version"
              }
          }

          $sb = [System.Text.StringBuilder]::new()
          [void]$sb.AppendLine("$versionBadge $statusBadge")
          [void]$sb.AppendLine()
          [void]$sb.AppendLine("## What's Changed")

          if ($featureLines.Count -gt 0) {
              foreach ($f in $featureLines) {
                  [void]$sb.AppendLine($f)
              }
          }

          if ($depLines.Count -gt 0) {
              [void]$sb.AppendLine()
              [void]$sb.AppendLine("<details>")
              [void]$sb.AppendLine("<summary><b>Dependency Updates</b></summary>")
              [void]$sb.AppendLine()
              foreach ($d in $depLines) {
                  [void]$sb.AppendLine($d)
              }
              [void]$sb.AppendLine()
              [void]$sb.AppendLine("</details>")
          }

          if ($changelogLine) {
              [void]$sb.AppendLine()
              [void]$sb.AppendLine($changelogLine)
          }

          $finalBody = Format-ChangelogEntry $sb.ToString().Trim()
          Set-Content -Path "release-notes.md" -Value $finalBody -Encoding utf8
          Write-Host "Generated Release Notes:"
          Write-Host $finalBody

      - name: Generate Build Provenance Attestations
        if: ${{ !github.event.repository.private }}
        continue-on-error: true
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: 'release-dist/*'

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.version || env.RELEASE_VERSION }}
          name: Release ${{ steps.version.outputs.version || env.RELEASE_VERSION }}
          draft: ${{ github.event.inputs.draft }}
          prerelease: ${{ github.event.inputs.prerelease }}
          body_path: release-notes.md
          files: release-dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
