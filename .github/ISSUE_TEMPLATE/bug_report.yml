name: Bug report
description: Report a bug or unexpected behavior in Vinta
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: describe
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: To Reproduce
      description: Optional steps to reproduce the behavior.
    validations:
      required: false
  - type: textarea
    id: desktop
    attributes:
      label: Desktop (optional)
      description: Optional environment details (auto-filled when reported from Vinta).
      placeholder: |
        - Vinta Version:
        - OS:
    validations:
      required: false
