run:
  timeout: 5m

linters:
  disable-all: true
  enable:
    - gofmt
    - govet
    - errcheck
    - staticcheck
    - ineffassign
    - typecheck
    - gosimple
    - unused
    - misspell
    - revive

issues:
  exclude-dirs:
    - frontend/node_modules
  exclude-use-default: false
  max-issues-per-linter: 0
  max-same-issues: 0
