version: "2"

run:
  timeout: 5m

formatters:
  enable:
    - gofmt

linters:
  default: none
  enable:
    - govet
    - errcheck
    - staticcheck
    - ineffassign
    - gosimple
    - unused
    - misspell
    - revive
  exclusions:
    paths:
      - frontend/node_modules

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
